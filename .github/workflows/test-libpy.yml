name: "Test libpy - Multi-Python"

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        description: "The commit SHA from the apk repository"
        type: string

jobs:
  libpy_matrix:
    name: "libpy: Python ${{ matrix.python }} (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75

    # Python 3.7 and the macOS-only Python 3.9 compatibility row remain
    # best-effort. The other legacy rows also host blocking pybridge ABI and/or
    # native-debugger checks, so their libpy steps opt into soft failure below
    # instead of making the entire shared runner allow-failure.
    continue-on-error: ${{ matrix.python == '3.7' || (matrix.os == 'macos-15-intel' && matrix.python == '3.9') }}

    strategy:
      fail-fast: false
      matrix:
        # Every supported Python is exercised on all release platforms. These
        # jobs load the selected interpreter in-process and run real plot
        # pipelines in addition to libpy's symbol/ABI checks.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        experimental: [false]
        runtime_tests: [true]
        include:
          # Python 3.7 is EOL and only retained as a libpy diagnostic.
          - os: ubuntu-22.04
            python: "3.7"
            experimental: true
            runtime_tests: false

          # Python 3.8/3.9 are below the supported runtime floor, but exercise
          # the full interpreter and plotting suite on every desktop OS.
          # Use Intel macOS for these older CPython distributions.
          - os: ubuntu-22.04
            python: "3.8"
            experimental: true
            runtime_tests: true
          - os: macos-15-intel
            python: "3.8"
            experimental: true
            runtime_tests: true
          - os: windows-latest
            python: "3.8"
            experimental: true
            runtime_tests: true
          - os: ubuntu-latest
            python: "3.9"
            experimental: true
            runtime_tests: true
          - os: macos-15-intel
            python: "3.9"
            experimental: true
            runtime_tests: true
          - os: windows-latest
            python: "3.9"
            experimental: true
            runtime_tests: true

    steps:
      - name: Checkout apk source
        uses: actions/checkout@v4
        with:
          repository: Mengzhiyaa/apk
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.APK_SOURCE_PAT }}

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Set up MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify selected Python
        run: |
          python --version
          python -c "import platform, sys, sysconfig; expected='${{ matrix.python }}'; actual=f'{sys.version_info.major}.{sys.version_info.minor}'; print(f'executable: {sys.executable}'); print(f'platform: {platform.platform()}'); print(f'prefix: {sys.prefix}'); print('LDLIBRARY:', sysconfig.get_config_var('LDLIBRARY')); assert actual == expected, f'expected Python {expected}, got {actual}'"
          python crates/libpy/tests/fixtures/find_libpython.py

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux' && matrix.runtime_tests
        continue-on-error: ${{ matrix.experimental }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        continue-on-error: ${{ matrix.experimental }}
        run: brew install zeromq

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        continue-on-error: ${{ matrix.experimental }}
        shell: pwsh
        run: |
          vcpkg install zeromq:x64-windows
          "CMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Python plotting dependencies
        if: ${{ matrix.runtime_tests }}
        continue-on-error: ${{ matrix.experimental }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install matplotlib numpy
          python -c "import matplotlib, numpy; print(f'matplotlib={matplotlib.__version__}, numpy={numpy.__version__}')"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Linux rows share Rust dependencies by runner image. Keep the
          # existing per-Python cache separation on macOS and Windows.
          shared-key: ${{ runner.os == 'Linux' && format('linux-{0}', matrix.os) || '' }}
          key: ${{ runner.os != 'Linux' && format('libpy-{0}-python-{1}', matrix.os, matrix.python) || '' }}

          # test-linux writes the ubuntu-latest cache. Python 3.8 is the
          # broader ubuntu-22.04 row and is that image's only cache writer.
          save-if: >-
            ${{ runner.os != 'Linux' ||
                (matrix.os == 'ubuntu-22.04' && matrix.python == '3.8') }}

      - name: Set APK_PYTHON_PATH
        run: python -c "import os, sys; open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write(f'APK_PYTHON_PATH={sys.executable}\n')"

      - name: Run libpy tests (symbol resolution + ABI validation)
        continue-on-error: ${{ matrix.experimental }}
        run: cargo test -p libpy -- --nocapture --test-threads=1

      - name: Run libpy-check (compile-time signature validation)
        if: ${{ !matrix.experimental }}
        run: |
          cargo build -p libpy-check
          cargo run -p libpy-check

      # Reuse this already-provisioned runner for every pybridge ABI row that
      # previously used the same OS/architecture/Python combination. The
      # remaining Intel macOS and native ARM64 rows stay in test-pybridge.yml.
      - name: Verify PyConfig ABI and initialize selected Python
        if: ${{ matrix.python != '3.7' && (runner.os != 'macOS' || matrix.python == '3.8' || matrix.python == '3.13' || matrix.python == '3.14') }}
        env:
          APK_VERIFY_PYCONFIG_ABI: "1"
        run: cargo test -p pybridge -- --nocapture --test-threads=1

      - name: Initialize the selected Python through pybridge
        if: ${{ matrix.runtime_tests && runner.os == 'macOS' && matrix.python != '3.8' && matrix.python != '3.13' && matrix.python != '3.14' }}
        continue-on-error: ${{ matrix.experimental }}
        run: cargo test -p pybridge --test integration test_initialized_ -- --nocapture --test-threads=1

      - name: Create a figure through the embedded Matplotlib backend
        if: ${{ matrix.runtime_tests }}
        continue-on-error: ${{ matrix.experimental }}
        run: cargo test -p apk --test integration test_matplotlib_backend_load -- --exact --nocapture --test-threads=1

      - name: Exercise the console plot comm pipeline
        if: ${{ matrix.runtime_tests }}
        continue-on-error: ${{ matrix.experimental }}
        run: cargo test -p apk --test kernel_suite kernel_plots::test_plot_metadata_execution_id_matches_execute_request_msg_id -- --exact --nocapture --test-threads=1

      - name: Render a notebook plot as PNG display data
        if: ${{ matrix.runtime_tests }}
        continue-on-error: ${{ matrix.experimental }}
        env:
          APK_TEST_SESSION_MODE: notebook
        run: cargo test -p apk --test kernel_notebook_suite kernel_plots_notebook::test_notebook_mode_sends_display_data_for_matplotlib -- --exact --nocapture --test-threads=1

      # These versions used to be four separate ubuntu-latest jobs. Keep the
      # test blocking even on Python 3.8, whose libpy compatibility checks are
      # best-effort.
      - name: Resolve Python executable for native debugger tests
        if: ${{ runner.os == 'Linux' && (matrix.python == '3.8' || matrix.python == '3.11' || matrix.python == '3.13' || matrix.python == '3.14') }}
        run: |
          python -m venv .venv-apk-debug-tests
          echo "APK_PYTHON_PATH=$GITHUB_WORKSPACE/.venv-apk-debug-tests/bin/python" >> "$GITHUB_ENV"

      - name: Run native debugger behavior tests
        if: ${{ runner.os == 'Linux' && (matrix.python == '3.8' || matrix.python == '3.11' || matrix.python == '3.13' || matrix.python == '3.14') }}
        env:
          CC: /usr/bin/gcc
          CXX: /usr/bin/g++
        run: >-
          cargo test -p apk --features lsp --test kernel_suite
          kernel_debug::test_native_console_dap_breakpoint_evaluate_and_step

  # Release builds above are blocking. Keep unusual Windows layouts as
  # best-effort diagnostics because they cannot install the normal plot suite.
  libpy_windows:
    name: "libpy: Windows variant diagnostics"
    uses: ./.github/workflows/test-libpy-windows.yml
    secrets: inherit
    with:
      source_sha: ${{ inputs.source_sha }}
