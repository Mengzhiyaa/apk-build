name: "Test libpy - Multi-Python"

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        description: "The commit SHA from the apk repository"
        type: string

jobs:
  libpy_matrix:
    name: "libpy ABI + runtime | ${{ matrix.os }} | CPython ${{ matrix.python }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75

    # Only unsupported Python 3.7 is informational. All 3.8–3.15 release
    # interpreters and their ABI/runtime checks are required.
    continue-on-error: ${{ matrix.python == '3.7' }}

    strategy:
      fail-fast: false
      matrix:
        # Every supported Python is exercised on all release platforms. These
        # jobs load the selected interpreter in-process and run real plot
        # pipelines in addition to libpy's symbol/ABI checks.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        experimental: [false]
        runtime_tests: [true]
        include:
          # Python 3.7 is EOL and only retained as a libpy diagnostic.
          - os: ubuntu-22.04
            python: "3.7"
            experimental: true
            runtime_tests: false

          # Python 3.8/3.9 are supported and run the full interpreter/plot suite.
          # Use Intel macOS for these older CPython distributions.
          - os: ubuntu-22.04
            python: "3.8"
            experimental: false
            runtime_tests: true
          - os: macos-15-intel
            python: "3.8"
            experimental: false
            runtime_tests: true
          - os: windows-latest
            python: "3.8"
            experimental: false
            runtime_tests: true
          - os: ubuntu-latest
            python: "3.9"
            experimental: false
            runtime_tests: true
          - os: macos-15-intel
            python: "3.9"
            experimental: false
            runtime_tests: true
          - os: windows-latest
            python: "3.9"
            experimental: false
            runtime_tests: true

    steps:
      - name: Enable Git long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout apk source
        uses: actions/checkout@v7
        with:
          repository: Mengzhiyaa/apk
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.APK_SOURCE_PAT }}

      - name: Set up Python ${{ matrix.python }}
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        if: ${{ matrix.runtime_tests }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: false

      - name: Set up MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: x64

      - name: Verify selected Python
        run: |
          python --version
          python -c "import platform, sys, sysconfig; expected='${{ matrix.python }}'; actual=f'{sys.version_info.major}.{sys.version_info.minor}'; print(f'executable: {sys.executable}'); print(f'platform: {platform.platform()}'); print(f'prefix: {sys.prefix}'); print('LDLIBRARY:', sysconfig.get_config_var('LDLIBRARY')); assert actual == expected, f'expected Python {expected}, got {actual}'"
          python crates/libpy/tests/fixtures/find_libpython.py

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux' && matrix.runtime_tests
        continue-on-error: ${{ matrix.experimental }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        continue-on-error: ${{ matrix.experimental }}
        run: brew install zeromq

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        continue-on-error: ${{ matrix.experimental }}
        shell: pwsh
        run: |
          vcpkg install zeromq:x64-windows
          "CMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Python plotting dependencies
        if: ${{ matrix.runtime_tests }}
        continue-on-error: ${{ matrix.experimental }}
        run: |
          uv pip install --system --python "${{ steps.python.outputs.python-path }}" matplotlib numpy
          python -c "import matplotlib, numpy; print(f'matplotlib={matplotlib.__version__}, numpy={numpy.__version__}')"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Python versions share a cache within the same runner image and
          # architecture. Keep distro/image boundaries explicit because native
          # dependency artifacts are not portable between them.
          shared-key: >-
            ${{ matrix.os == 'ubuntu-latest' && 'kernel-Linux-X64-runtime' ||
                matrix.os == 'ubuntu-22.04' && 'rust-test-linux-ubuntu-22.04-x64' ||
                matrix.os == 'macos-latest' && 'kernel-macOS-ARM64-runtime' ||
                matrix.os == 'macos-15-intel' && 'rust-test-macos-15-intel-x64' ||
                matrix.os == 'windows-latest' && 'kernel-Windows-X64-runtime' }}

          # The fixed-platform test jobs are the writers for the common
          # macOS/Windows caches. Ubuntu 22.04 has no fixed-platform job, so
          # its Python 3.8 row is the sole writer for that image.
          save-if: >-
            ${{ matrix.os == 'ubuntu-22.04' && matrix.python == '3.8' }}

      - name: Set APK_PYTHON_PATH
        run: python -c "import os, sys; open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write(f'APK_PYTHON_PATH={sys.executable}\n')"

      - name: Run libpy tests (symbol resolution + ABI validation)
        continue-on-error: ${{ matrix.experimental }}
        run: cargo test --locked -p libpy -- --nocapture --test-threads=1

      - name: Run libpy-check (compile-time signature validation)
        if: ${{ !matrix.experimental }}
        run: |
          cargo build --locked -p libpy-check
          cargo run --locked -p libpy-check

      # Reuse this already-provisioned runner for every pybridge ABI row that
      # previously used the same OS/architecture/Python combination. The
      # remaining Intel macOS and native ARM64 rows stay in test-pybridge.yml.
      - name: Verify PyConfig ABI
        if: ${{ matrix.python != '3.7' && (runner.os != 'macOS' || matrix.python == '3.8' || matrix.python == '3.13' || matrix.python == '3.14' || matrix.python == '3.15') }}
        env:
          APK_VERIFY_PYCONFIG_ABI: "1"
        run: >-
          cargo test --locked -p pybridge --lib
          pyconfig_abi::tests::selected_cpython_headers_match_table
          -- --exact --nocapture

      - name: Run pybridge tests
        if: ${{ matrix.python != '3.7' && (runner.os != 'macOS' || matrix.python == '3.8' || matrix.python == '3.13' || matrix.python == '3.14' || matrix.python == '3.15') }}
        run: cargo test --locked -p pybridge -- --nocapture --test-threads=1

      - name: Initialize the selected Python through pybridge
        if: ${{ matrix.runtime_tests && runner.os == 'macOS' && matrix.python != '3.8' && matrix.python != '3.13' && matrix.python != '3.14' && matrix.python != '3.15' }}
        continue-on-error: ${{ matrix.experimental }}
        run: cargo test --locked -p pybridge --test integration test_initialized_ -- --nocapture --test-threads=1

      - name: Create a figure through the embedded Matplotlib backend
        if: ${{ matrix.runtime_tests }}
        continue-on-error: ${{ matrix.experimental }}
        run: cargo test --locked -p apk --test integration test_matplotlib_backend_load -- --exact --nocapture --test-threads=1

      - name: Exercise the console plot comm pipeline
        if: ${{ matrix.runtime_tests }}
        continue-on-error: ${{ matrix.experimental }}
        run: cargo test --locked -p apk --test kernel_suite kernel_plots::test_plot_metadata_execution_id_matches_execute_request_msg_id -- --exact --nocapture --test-threads=1

      - name: Render a notebook plot as PNG display data
        if: ${{ matrix.runtime_tests }}
        continue-on-error: ${{ matrix.experimental }}
        env:
          APK_TEST_SESSION_MODE: notebook
        run: cargo test --locked -p apk --test kernel_notebook_suite kernel_plots_notebook::test_notebook_mode_sends_display_data_for_matplotlib -- --exact --nocapture --test-threads=1

  # Release builds above are blocking. Keep unusual Windows layouts as
  # best-effort diagnostics because they cannot install the normal plot suite.
  libpy_windows:
    name: libpy diagnostics | Windows | unsupported distributions
    uses: ./.github/workflows/test-libpy-windows.yml
    secrets: inherit
    with:
      source_sha: ${{ inputs.source_sha }}
