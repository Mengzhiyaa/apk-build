name: Build APK Release
# Preserve the original release entry points and platform build/publication jobs.
on:
  repository_dispatch:
    types: [run-release]
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        description: Full source SHA to test and release
        type: string
      backend:
        description: Backend to release
        type: choice
        default: ty
        options: [runtime, ty, pyrefly]
      release_channel:
        description: Release channel
        type: choice
        default: alpha
        options: [alpha, beta, rc, stable]
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      backend:
        type: string
        default: ty
      release_channel:
        type: string
        default: alpha
      tests_verified:
        description: Internal caller has passed the same-SHA complete test gate
        type: boolean
        default: false

# Only one release at a time
concurrency:
  group: release-${{ github.event.client_payload.release_backend || github.event.client_payload.backend || inputs.backend || 'ty' }}-${{ github.event.client_payload.release_channel || inputs.release_channel || 'alpha' }}
  cancel-in-progress: false

# Required for creating releases and tags
permissions:
  contents: write

jobs:
  # Resolve inputs
  resolve:
    name: Resolve Inputs
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      channel: ${{ steps.resolve.outputs.channel }}
      backend: ${{ steps.resolve.outputs.release_backend }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate release request
        id: resolve
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: python .github/scripts/resolve.py --publish

  verify:
    name: Test source before release
    needs: resolve
    if: inputs.tests_verified != true
    uses: ./.github/workflows/test-suite.yml
    secrets: inherit
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}
      backend: all

  gate:
    name: Require successful tests
    if: always() && !cancelled()
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        env:
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          TEST_RESULT: ${{ needs.verify.result }}
          TESTS_VERIFIED: ${{ inputs.tests_verified }}
        with:
          script: |
            if (process.env.RESOLVE_RESULT !== 'success' ||
                (process.env.TESTS_VERIFIED !== 'true' && process.env.TEST_RESULT !== 'success')) {
              core.setFailed('The source must pass all required tests before a release build');
            }

  # Extract the current version of APK from its Cargo.toml file.
  get_version:
    name: Determine APK Version
    needs: [resolve]
    runs-on: ubuntu-latest
    outputs:
      APK_VERSION: ${{ steps.extract_version.outputs.result }}
      RELEASE_TAG: ${{ steps.extract_version.outputs.tag }}
      IS_PRERELEASE: ${{ steps.extract_version.outputs.prerelease }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          repository: Mengzhiyaa/apk
          ref: ${{ needs.resolve.outputs.sha }}
          token: ${{ secrets.APK_SOURCE_PAT }}

      - name: Determine Version
        id: extract_version
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          BACKEND: ${{ needs.resolve.outputs.backend }}
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("crates/apk/Cargo.toml", "rb"))["package"]["version"])')

          if [ "$CHANNEL" = "stable" ]; then
            TAG="${VERSION}"
            PRERELEASE="false"
          else
            TAG="${VERSION}-${CHANNEL}"
            PRERELEASE="true"
          fi

          # Keep the canonical ty filenames; other backends use distinct tags/assets.
          if [ "$BACKEND" != "ty" ]; then
            TAG="${TAG}-${BACKEND}"
          fi

          echo "APK version: ${VERSION}, tag: ${TAG}, channel: ${CHANNEL}, prerelease: ${PRERELEASE}"
          {
            echo "result=${VERSION}"
            echo "tag=${TAG}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

  # Report pending status
  report_pending:
    name: Report Pending
    needs: [resolve]
    runs-on: ubuntu-latest
    steps:
      - name: Set pending commit status
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.APK_SOURCE_PAT }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: 'Mengzhiyaa',
              repo: 'apk',
              sha: '${{ needs.resolve.outputs.sha }}',
              state: 'pending',
              target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              context: 'apk-build / release (${{ needs.resolve.outputs.backend }})',
              description: 'Release build in progress...'
            });

  # Build APK for all platforms
  build_linux:
    name: Build Linux
    uses: ./.github/workflows/release-linux.yml
    needs: [get_version, resolve, report_pending, gate]
    secrets: inherit
    with:
      version: ${{ needs.get_version.outputs.RELEASE_TAG }}
      source_sha: ${{ needs.resolve.outputs.sha }}
      backend: ${{ needs.resolve.outputs.backend }}

  build_macos:
    name: Build macOS
    uses: ./.github/workflows/release-macos.yml
    needs: [get_version, resolve, report_pending, gate]
    secrets: inherit
    with:
      version: ${{ needs.get_version.outputs.RELEASE_TAG }}
      source_sha: ${{ needs.resolve.outputs.sha }}
      backend: ${{ needs.resolve.outputs.backend }}

  build_windows:
    name: Build Windows
    uses: ./.github/workflows/release-windows.yml
    needs: [get_version, resolve, report_pending, gate]
    secrets: inherit
    with:
      version: ${{ needs.get_version.outputs.RELEASE_TAG }}
      source_sha: ${{ needs.resolve.outputs.sha }}
      backend: ${{ needs.resolve.outputs.backend }}

  # Create a GitHub Release and upload all binaries
  create_release:
    name: Create Release & Upload Binaries
    runs-on: ubuntu-latest
    needs: [resolve, get_version, build_linux, build_macos, build_windows]
    steps:
      # Download all platform binaries
      - name: Download Linux x64
        uses: actions/download-artifact@v8
        with:
          name: apk-release-linux-x64-archive

      - name: Download Linux arm64
        uses: actions/download-artifact@v8
        with:
          name: apk-release-linux-arm64-archive

      - name: Download macOS arm64
        uses: actions/download-artifact@v8
        with:
          name: apk-release-darwin-arm64-archive

      - name: Download macOS x64
        uses: actions/download-artifact@v8
        with:
          name: apk-release-darwin-x64-archive

      - name: Download macOS universal
        uses: actions/download-artifact@v8
        with:
          name: apk-release-darwin-universal-archive

      - name: Download Windows x64
        uses: actions/download-artifact@v8
        with:
          name: apk-release-windows-x64-archive

      - name: Download Windows arm64
        uses: actions/download-artifact@v8
        with:
          name: apk-release-windows-arm64-archive

      # Create release and upload all binaries in one step
      - name: Create release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get_version.outputs.RELEASE_TAG }}
          name: APK ${{ needs.get_version.outputs.RELEASE_TAG }}
          draft: false
          prerelease: ${{ needs.get_version.outputs.IS_PRERELEASE == 'true' }}
          body: "Backend: ${{ needs.resolve.outputs.backend }}; source: ${{ needs.resolve.outputs.sha }}. All required tests passed before this build."
          generate_release_notes: true
          make_latest: ${{ needs.get_version.outputs.IS_PRERELEASE != 'true' }}
          files: |
            apk-${{ needs.get_version.outputs.RELEASE_TAG }}-linux-x64.zip
            apk-${{ needs.get_version.outputs.RELEASE_TAG }}-linux-arm64.zip
            apk-${{ needs.get_version.outputs.RELEASE_TAG }}-darwin-arm64.zip
            apk-${{ needs.get_version.outputs.RELEASE_TAG }}-darwin-x64.zip
            apk-${{ needs.get_version.outputs.RELEASE_TAG }}-darwin-universal.zip
            apk-${{ needs.get_version.outputs.RELEASE_TAG }}-windows-x64.zip
            apk-${{ needs.get_version.outputs.RELEASE_TAG }}-windows-arm64.zip

  # Report final status back to apks
  report_status:
    name: Report Status
    if: always()
    needs: [resolve, create_release]
    runs-on: ubuntu-latest
    steps:
      - name: Determine overall result
        id: result
        run: |
          if [ "${{ needs.create_release.result }}" = "success" ]; then
            echo "state=success"
            echo "description=Release published successfully"
          else
            echo "state=failure"
            echo "description=Release failed"
          fi >> "$GITHUB_OUTPUT"

      - name: Report commit status to apks
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.APK_SOURCE_PAT }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: 'Mengzhiyaa',
              repo: 'apk',
              sha: '${{ needs.resolve.outputs.sha }}',
              state: '${{ steps.result.outputs.state }}',
              target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              context: 'apk-build / release (${{ needs.resolve.outputs.backend }})',
              description: '${{ steps.result.outputs.description }}'
            });

