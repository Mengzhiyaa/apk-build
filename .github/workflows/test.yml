name: Test APK
run-name: "Test APK | ${{ github.event.client_payload.ref || inputs.source_ref || 'main' }} | backends=${{ github.event.client_payload.backend || github.event.client_payload.features || inputs.backend || 'all' }}"
on:
  repository_dispatch:
    types: [run-tests]
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        description: Full APK commit SHA to test
        type: string
      source_ref:
        description: Source branch (for reports)
        default: main
        type: string
      backend:
        description: Test backends
        type: choice
        default: all
        options: [all, runtime, ty, pyrefly]
      release:
        description: Publish after the complete test gate passes
        type: boolean
        default: false
      release_backend:
        description: Backend to release
        type: choice
        default: ty
        options: [runtime, ty, pyrefly]
      release_channel:
        description: Release channel
        type: choice
        default: alpha
        options: [alpha, beta, rc, stable]
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      source_ref:
        type: string
        default: main
      backend:
        type: string
        default: all
      release:
        type: boolean
        default: false
      release_backend:
        type: string
        default: ty
      release_channel:
        type: string
        default: alpha

# Keep focused runs separate from all-backend runs and release requests.
concurrency:
  group: test-${{ github.event.client_payload.sha || inputs.source_sha }}-${{ github.event.client_payload.backend || github.event.client_payload.features || inputs.backend || 'all' }}-${{ github.event.client_payload.release || inputs.release || github.event.action == 'run-release' }}-${{ github.event.client_payload.release_backend || inputs.release_backend || 'ty' }}-${{ github.event.client_payload.release_channel || inputs.release_channel || 'alpha' }}
  cancel-in-progress: ${{ github.event.client_payload.release != true && inputs.release != true && github.event.action != 'run-release' }}

permissions:
  contents: write # The gated reusable release publishes artifacts and tags.

jobs:
  resolve:
    name: Validate test request
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      ref: ${{ steps.resolve.outputs.ref }}
      backend: ${{ steps.resolve.outputs.backend }}
      release: ${{ steps.resolve.outputs.release }}
      release_backend: ${{ steps.resolve.outputs.release_backend }}
      channel: ${{ steps.resolve.outputs.channel }}
      status_context: ${{ steps.resolve.outputs.status_context }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate dispatch contract
        id: resolve
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: python .github/scripts/resolve.py
      - name: Set pending commit status
        uses: actions/github-script@v9
        env:
          SOURCE_SHA: ${{ steps.resolve.outputs.sha }}
          STATUS_CONTEXT: ${{ steps.resolve.outputs.status_context }}
        with:
          github-token: ${{ secrets.APK_SOURCE_PAT }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: 'Mengzhiyaa', repo: 'apk', sha: process.env.SOURCE_SHA,
              state: 'pending', context: process.env.STATUS_CONTEXT,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Required tests are running'
            });

  verify:
    name: Required APK checks | ${{ needs.resolve.outputs.backend }} backends
    needs: resolve
    uses: ./.github/workflows/test-suite.yml
    secrets: inherit
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}
      source_ref: ${{ needs.resolve.outputs.ref }}
      backend: ${{ needs.resolve.outputs.backend }}

  report_status:
    name: Commit status | required test gate
    if: always() && needs.resolve.result == 'success'
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          STATUS_CONTEXT: ${{ needs.resolve.outputs.status_context }}
          RESULT: ${{ needs.verify.result }}
        with:
          github-token: ${{ secrets.APK_SOURCE_PAT }}
          script: |
            const passed = process.env.RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: 'Mengzhiyaa', repo: 'apk', sha: process.env.SOURCE_SHA,
              state: passed ? 'success' : 'failure', context: process.env.STATUS_CONTEXT,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: passed ? 'All required tests passed' : `Required tests: ${process.env.RESULT}`
            });

  release:
    name: Release | tested source + selected backend
    needs: [resolve, verify, report_status]
    if: needs.resolve.outputs.release == 'true'
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}
      backend: ${{ needs.resolve.outputs.release_backend }}
      release_channel: ${{ needs.resolve.outputs.channel }}
      tests_verified: true
