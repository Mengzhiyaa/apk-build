name: "Test APK - Linux"
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      backend:
        type: string
        default: runtime
permissions:
  contents: read
jobs:
  linux:
    name: "Kernel ${{ inputs.backend }} | Linux x64 | CPython 3.13 | Clippy + tests"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APK_BACKEND: ${{ inputs.backend }}
      RUST_BACKTRACE: '1'
    steps:
      - name: Checkout APK source
        uses: actions/checkout@v7
        with:
          repository: Mengzhiyaa/apk
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.APK_SOURCE_PAT }}
      - uses: ./.github/actions/setup-test
        with:
          # Runtime owns the shared Python cache; other backends restore it.
          save-python-cache: ${{ inputs.backend == 'runtime' }}
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: kernel-${{ runner.os }}-${{ runner.arch }}-${{ inputs.backend }}
      - name: Clippy workspace and all targets (${{ inputs.backend }})
        run: just clippy
      - name: Workspace and kernel acceptance tests (${{ inputs.backend }})
        run: just test
