name: "Benchmark APK"

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        description: "The APK commit SHA to benchmark"
        type: string
      source_ref:
        required: false
        description: "The APK branch/ref"
        default: "main"
        type: string
      benchmark_mode:
        required: false
        description: "Run a functional smoke check or collect performance measurements"
        default: "performance"
        type: string
  repository_dispatch:
    types: [run-benchmarks]
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        description: "The APK commit SHA to benchmark"
        type: string
      source_ref:
        required: false
        description: "The APK branch/ref"
        default: "main"
        type: string

concurrency:
  group: benchmark-${{ github.event.client_payload.sha || inputs.source_sha }}-${{ inputs.benchmark_mode || 'performance' }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve benchmark source
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      ref: ${{ steps.resolve.outputs.ref }}
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
      - name: Resolve dispatch payload
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "sha=${{ github.event.client_payload.sha }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.event.client_payload.ref || 'main' }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ inputs.source_sha }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ inputs.source_ref }}" >> "$GITHUB_OUTPUT"
          fi
          mode="${{ inputs.benchmark_mode }}"
          if [ -z "$mode" ]; then
            mode="performance"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Set pending commit status
        if: steps.resolve.outputs.mode == 'performance'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.APK_SOURCE_PAT }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: 'Mengzhiyaa',
              repo: 'apk',
              sha: '${{ steps.resolve.outputs.sha }}',
              state: 'pending',
              target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              context: 'apk-build / benchmarks',
              description: 'Phase A benchmarks are running...'
            });

  phase-a:
    name: Phase A feature-overhead benchmarks
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUST_BACKTRACE: "1"
      # Keep release optimizations while avoiding production fat-LTO link time.
      CARGO_PROFILE_RELEASE_LTO: "off"
    steps:
      - name: Checkout APK source
        uses: actions/checkout@v7
        with:
          repository: Mengzhiyaa/apk
          ref: ${{ needs.resolve.outputs.sha }}
          token: ${{ secrets.APK_SOURCE_PAT }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev

      - name: Set up Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          python-version: "3.13"
          activate-environment: true
          enable-cache: true
          cache-suffix: apk-phase-a-py313
          cache-dependency-glob: Cargo.lock
          ignore-nothing-to-cache: true

      - name: Install performance benchmark Python dependencies
        if: needs.resolve.outputs.mode == 'performance'
        run: |
          uv pip install "scanpy>=1.12" "ipywidgets>=8.1" "matplotlib>=3.8" "numpy>=1.26" "pandas>=2.1"
          python -c "import ipywidgets, matplotlib, numpy, pandas, scanpy; print('Benchmark dependencies ready')"

      - name: Select benchmark Python
        run: echo "APK_PYTHON_PATH=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: benchmark-phase-a-linux-py313

      - name: Lint benchmark crate
        if: needs.resolve.outputs.mode == 'performance'
        run: cargo clippy --locked -p apk_benchmark --all-targets --features lsp -- -D warnings

      - name: Run core feature-overhead suite
        if: needs.resolve.outputs.mode == 'performance'
        run: |
          cargo run --locked --release -p apk_benchmark --features lsp -- run \
            --suite core \
            --pure-python-baseline all \
            --repetitions 5 \
            --iterations 10 \
            --warmup 3 \
            --output target/bench/core.json

      - name: Render core report
        if: needs.resolve.outputs.mode == 'performance'
        run: |
          cargo run --locked --release -p apk_benchmark --features lsp -- report \
            target/bench/core.json \
            --html target/bench/core.html

      - name: Run Scanpy comprehensive suite
        if: needs.resolve.outputs.mode == 'performance'
        run: |
          cargo run --locked --release -p apk_benchmark --features lsp -- run \
            --suite scanpy \
            --pure-python-baseline all \
            --repetitions 5 \
            --iterations 1 \
            --warmup 3 \
            --output target/bench/scanpy.json

      - name: Render Scanpy report
        if: needs.resolve.outputs.mode == 'performance'
        run: |
          cargo run --locked --release -p apk_benchmark --features lsp -- report \
            target/bench/scanpy.json \
            --html target/bench/scanpy.html

      - name: Add Scanpy comparison to job summary
        if: needs.resolve.outputs.mode == 'performance'
        shell: bash
        run: |
          {
            echo "## Scanpy Base vs feature profiles"
            echo
            echo "| Profile | Pipeline | Base end-to-end | Feature end-to-end | Ratio | 95% CI |"
            echo "|---|---|---:|---:|---:|---:|"
            jq -r '.comparisons[] | select((.workload | startswith("scanpy_")) and .metric == "end_to_end_ns") | [.profile, .workload, ((.base_median / 1000000) | tostring), ((.feature_median / 1000000) | tostring), (.ratio | tostring), (((.ci95_low | tostring) + "–" + (.ci95_high | tostring)))] | @tsv' target/bench/scanpy.json |
              while IFS=$'\t' read -r profile workload base feature ratio ci; do
                printf '| %s | %s | %.2f ms | %.2f ms | %.3fx | %s |\n' "$profile" "$workload" "$base" "$feature" "$ratio" "$ci"
              done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run benchmark smoke check
        if: needs.resolve.outputs.mode == 'smoke'
        run: |
          cargo run --locked --release -p apk_benchmark --features lsp -- run \
            --suite pr-quick \
            --pure-python-baseline noop \
            --repetitions 1 \
            --iterations 3 \
            --warmup 1 \
            --output target/bench/smoke.json

      - name: Render smoke report
        if: needs.resolve.outputs.mode == 'smoke'
        run: |
          cargo run --locked --release -p apk_benchmark --features lsp -- report \
            target/bench/smoke.json \
            --html target/bench/smoke.html

      - name: Publish performance benchmark summary
        if: always() && needs.resolve.outputs.mode == 'performance'
        shell: bash
        run: |
          {
            echo "## APK Phase A benchmarks"
            echo
            echo "- Source: \`${{ needs.resolve.outputs.sha }}\`"
            echo "- Ref: \`${{ needs.resolve.outputs.ref }}\`"
            echo "- Python: \`${APK_PYTHON_PATH:-unavailable}\`"
            echo "- Cargo profile: \`release\` with LTO disabled"
            echo "- Pure Python baseline: all selected workloads"
            echo "- Core result: \`target/bench/core.json\`"
            echo "- Scanpy result: \`target/bench/scanpy.json\`"
            echo
            echo "Performance results are informational; this workflow fails only when benchmark setup or execution fails."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish benchmark smoke summary
        if: always() && needs.resolve.outputs.mode == 'smoke'
        shell: bash
        run: |
          {
            echo "## APK benchmark smoke check"
            echo
            echo "- Source: \`${{ needs.resolve.outputs.sha }}\`"
            echo "- Ref: \`${{ needs.resolve.outputs.ref }}\`"
            echo "- Suite: \`pr-quick\`"
            echo "- Repetitions: \`1\`"
            echo "- Iterations: \`3\`"
            echo "- Warmup: \`1\`"
            echo "- Pure Python baseline: \`noop-request\`"
            echo "- Result: \`target/bench/smoke.json\`"
            echo
            echo "This run verifies that the benchmark completes successfully; it is not a performance measurement."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Phase A reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-a-benchmarks-${{ needs.resolve.outputs.sha }}
          path: |
            target/bench/*.json
            target/bench/*.html
          if-no-files-found: warn
          retention-days: 30

  session-smoke:
    name: ${{ matrix.os }} / ${{ matrix.session }} smoke
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_PROFILE_RELEASE_LTO: "off"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        session: [notebook, background]
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout APK source
        uses: actions/checkout@v7
        with:
          repository: Mengzhiyaa/apk
          ref: ${{ needs.resolve.outputs.sha }}
          token: ${{ secrets.APK_SOURCE_PAT }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install zeromq

      - name: Install Windows system dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install zeromq:x64-windows
          "CMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          python-version: "3.13"
          activate-environment: true
          enable-cache: true
          cache-suffix: apk-benchmark-${{ runner.os }}-py313
          cache-dependency-glob: Cargo.lock
          ignore-nothing-to-cache: true

      - name: Select Python on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: echo "APK_PYTHON_PATH=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Select Python on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $python = python -c "import sys; print(sys.executable)"
          "APK_PYTHON_PATH=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: benchmark-session-${{ runner.os }}-py313

      - name: Run session smoke benchmark
        run: cargo run --locked --release -p apk_benchmark --features lsp -- run --suite session-smoke --session-mode ${{ matrix.session }} --pure-python-baseline none --repetitions 1 --iterations 3 --warmup 1 --output target/bench/${{ matrix.session }}.json

      - name: Render session smoke report
        run: cargo run --locked --release -p apk_benchmark --features lsp -- report target/bench/${{ matrix.session }}.json --html target/bench/${{ matrix.session }}.html

      - name: Upload session smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: session-smoke-${{ runner.os }}-${{ matrix.session }}-${{ needs.resolve.outputs.sha }}
          path: |
            target/bench/*.json
            target/bench/*.html
          if-no-files-found: warn
          retention-days: 30

  report-status:
    name: Report benchmark status
    if: always()
    needs: [resolve, phase-a, session-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Determine result
        id: result
        shell: bash
        run: |
          if [ "${{ needs.phase-a.result }}" = "success" ] && [ "${{ needs.session-smoke.result }}" = "success" ]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
            echo "description=Phase A benchmarks completed" >> "$GITHUB_OUTPUT"
          else
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "description=Phase A benchmarks failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Set final commit status
        if: needs.resolve.outputs.mode == 'performance'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.APK_SOURCE_PAT }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: 'Mengzhiyaa',
              repo: 'apk',
              sha: '${{ needs.resolve.outputs.sha }}',
              state: '${{ steps.result.outputs.state }}',
              target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              context: 'apk-build / benchmarks',
              description: '${{ steps.result.outputs.description }}'
            });
