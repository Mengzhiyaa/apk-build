name: "Benchmark APK"

on:
  workflow_call:
    inputs:
      backend:
        description: Analysis backend (one backend per benchmark run)
        type: string
        default: ty
      source_sha:
        required: true
        description: "The APK commit SHA to benchmark"
        type: string
      source_ref:
        required: false
        description: "The APK branch/ref"
        default: "main"
        type: string
      benchmark_mode:
        required: false
        description: "Run a functional smoke check or collect performance measurements"
        default: "performance"
        type: string
  repository_dispatch:
    types: [run-benchmarks]
  workflow_dispatch:
    inputs:
      backend:
        description: Analysis backend
        type: choice
        default: ty
        options: [runtime, ty, pyrefly]
      source_sha:
        required: true
        description: "The APK commit SHA to benchmark"
        type: string
      source_ref:
        required: false
        description: "The APK branch/ref"
        default: "main"
        type: string

concurrency:
  group: benchmark-${{ github.event.client_payload.sha || inputs.source_sha }}-${{ inputs.benchmark_mode || 'performance' }}-${{ github.event.client_payload.backend || inputs.backend || 'ty' }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve benchmark source
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      ref: ${{ steps.resolve.outputs.ref }}
      mode: ${{ steps.resolve.outputs.mode }}
      backend: ${{ steps.resolve.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve benchmark request
        id: resolve
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: python .github/scripts/resolve.py --benchmark

      - name: Set pending commit status
        if: steps.resolve.outputs.mode == 'performance'
        uses: actions/github-script@v9
        env:
          SOURCE_SHA: ${{ steps.resolve.outputs.sha }}
          BACKEND: ${{ steps.resolve.outputs.backend }}
        with:
          github-token: ${{ secrets.APK_SOURCE_PAT }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: 'Mengzhiyaa',
              repo: 'apk',
              sha: process.env.SOURCE_SHA,
              state: 'pending',
              target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              context: `apk-build / benchmarks (${process.env.BACKEND})`,
              description: 'Phase A benchmarks are running...'
            });

  phase-a:
    name: "Benchmark ${{ needs.resolve.outputs.mode }} | ${{ needs.resolve.outputs.backend }} | Linux x64 console"
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      APK_BACKEND: ${{ needs.resolve.outputs.backend }}
      SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
      SOURCE_REF: ${{ needs.resolve.outputs.ref }}
      RUST_BACKTRACE: "1"
      # Keep release optimizations while avoiding production fat-LTO link time.
      CARGO_PROFILE_RELEASE_LTO: "off"
    steps:
      - name: Checkout APK source
        uses: actions/checkout@v7
        with:
          repository: Mengzhiyaa/apk
          ref: ${{ needs.resolve.outputs.sha }}
          token: ${{ secrets.APK_SOURCE_PAT }}

      - uses: ./.github/actions/setup-test
        with:
          python-dependencies: 'false'

      - name: Install performance benchmark Python dependencies
        if: needs.resolve.outputs.mode == 'performance'
        run: |
          uv pip install "scanpy>=1.12" "ipywidgets>=8.1" "matplotlib>=3.8" "numpy>=1.26" "pandas>=2.1"
          python -c "import ipywidgets, matplotlib, numpy, pandas, scanpy; print('Benchmark dependencies ready')"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: benchmark-phase-a-linux-py313-${{ needs.resolve.outputs.backend }}

      - name: Lint benchmark crate
        if: needs.resolve.outputs.mode == 'performance'
        run: just benchmark-clippy

      - name: Run core feature-overhead suite
        if: needs.resolve.outputs.mode == 'performance'
        run: |
          just benchmark-run run \
            --suite core \
            --pure-python-baseline all \
            --repetitions 5 \
            --iterations 10 \
            --warmup 3 \
            --output target/bench/core.json

      - name: Render core report
        if: needs.resolve.outputs.mode == 'performance'
        run: |
          just benchmark-run report \
            target/bench/core.json \
            --html target/bench/core.html

      - name: Run Scanpy comprehensive suite
        if: needs.resolve.outputs.mode == 'performance'
        run: |
          just benchmark-run run \
            --suite scanpy \
            --pure-python-baseline all \
            --repetitions 5 \
            --iterations 1 \
            --warmup 3 \
            --output target/bench/scanpy.json

      - name: Render Scanpy report
        if: needs.resolve.outputs.mode == 'performance'
        run: |
          just benchmark-run report \
            target/bench/scanpy.json \
            --html target/bench/scanpy.html

      - name: Add Scanpy comparison to job summary
        if: needs.resolve.outputs.mode == 'performance'
        shell: bash
        run: |
          {
            echo "## Scanpy Base vs feature profiles"
            echo
            echo "| Profile | Pipeline | Base end-to-end | Feature end-to-end | Ratio | 95% CI |"
            echo "|---|---|---:|---:|---:|---:|"
            jq -r '.comparisons[] | select((.workload | startswith("scanpy_")) and .metric == "end_to_end_ns") | [.profile, .workload, ((.base_median / 1000000) | tostring), ((.feature_median / 1000000) | tostring), (.ratio | tostring), (((.ci95_low | tostring) + "–" + (.ci95_high | tostring)))] | @tsv' target/bench/scanpy.json |
              while IFS=$'\t' read -r profile workload base feature ratio ci; do
                printf '| %s | %s | %.2f ms | %.2f ms | %.3fx | %s |\n' "$profile" "$workload" "$base" "$feature" "$ratio" "$ci"
              done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run benchmark smoke check
        if: needs.resolve.outputs.mode == 'smoke'
        run: |
          just benchmark-run run \
            --suite pr-quick \
            --pure-python-baseline noop \
            --repetitions 1 \
            --iterations 3 \
            --warmup 1 \
            --output target/bench/smoke.json

      - name: Render smoke report
        if: needs.resolve.outputs.mode == 'smoke'
        run: |
          just benchmark-run report \
            target/bench/smoke.json \
            --html target/bench/smoke.html

      - name: Publish performance benchmark summary
        if: always() && needs.resolve.outputs.mode == 'performance'
        shell: bash
        run: |
          {
            echo "## APK Phase A benchmarks"
            echo
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Ref: \`$SOURCE_REF\`"
            echo "- Python: \`${APK_PYTHON_PATH:-unavailable}\`"
            echo "- Cargo profile: \`release\` with LTO disabled"
            echo "- Pure Python baseline: all selected workloads"
            echo "- Core result: \`target/bench/core.json\`"
            echo "- Scanpy result: \`target/bench/scanpy.json\`"
            echo
            echo "Performance results are informational; this workflow fails only when benchmark setup or execution fails."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish benchmark smoke summary
        if: always() && needs.resolve.outputs.mode == 'smoke'
        shell: bash
        run: |
          {
            echo "## APK benchmark smoke check"
            echo
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Ref: \`$SOURCE_REF\`"
            echo "- Suite: \`pr-quick\`"
            echo "- Repetitions: \`1\`"
            echo "- Iterations: \`3\`"
            echo "- Warmup: \`1\`"
            echo "- Pure Python baseline: \`noop-request\`"
            echo "- Result: \`target/bench/smoke.json\`"
            echo
            echo "This run verifies that the benchmark completes successfully; it is not a performance measurement."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Phase A reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-a-benchmarks-${{ needs.resolve.outputs.backend }}-${{ needs.resolve.outputs.sha }}
          path: |
            target/bench/*.json
            target/bench/*.html
          if-no-files-found: warn
          retention-days: 30

  session-smoke:
    name: "Benchmark smoke | ${{ needs.resolve.outputs.backend }} | ${{ matrix.os }} | ${{ matrix.session }}"
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      APK_BACKEND: ${{ needs.resolve.outputs.backend }}
      CARGO_PROFILE_RELEASE_LTO: "off"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        session: [notebook, background]
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout APK source
        uses: actions/checkout@v7
        with:
          repository: Mengzhiyaa/apk
          ref: ${{ needs.resolve.outputs.sha }}
          token: ${{ secrets.APK_SOURCE_PAT }}

      - uses: ./.github/actions/setup-test
        with:
          python-dependencies: 'false'

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: benchmark-session-${{ runner.os }}-py313-${{ needs.resolve.outputs.backend }}

      - name: Run session smoke benchmark
        run: just benchmark-run run --suite session-smoke --session-mode ${{ matrix.session }} --pure-python-baseline none --repetitions 1 --iterations 3 --warmup 1 --output target/bench/${{ matrix.session }}.json

      - name: Render session smoke report
        run: just benchmark-run report target/bench/${{ matrix.session }}.json --html target/bench/${{ matrix.session }}.html

      - name: Upload session smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: session-smoke-${{ needs.resolve.outputs.backend }}-${{ runner.os }}-${{ matrix.session }}-${{ needs.resolve.outputs.sha }}
          path: |
            target/bench/*.json
            target/bench/*.html
          if-no-files-found: warn
          retention-days: 30

  report-status:
    name: Report benchmark status
    if: always()
    needs: [resolve, phase-a, session-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Determine result
        id: result
        shell: bash
        run: |
          if [ "${{ needs.phase-a.result }}" = "success" ] && [ "${{ needs.session-smoke.result }}" = "success" ]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
            echo "description=Phase A benchmarks completed" >> "$GITHUB_OUTPUT"
          else
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "description=Phase A benchmarks failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Set final commit status
        if: needs.resolve.outputs.mode == 'performance'
        uses: actions/github-script@v9
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          BACKEND: ${{ needs.resolve.outputs.backend }}
        with:
          github-token: ${{ secrets.APK_SOURCE_PAT }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: 'Mengzhiyaa',
              repo: 'apk',
              sha: process.env.SOURCE_SHA,
              state: '${{ steps.result.outputs.state }}',
              target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              context: `apk-build / benchmarks (${process.env.BACKEND})`,
              description: '${{ steps.result.outputs.description }}'
            });
