name: Debugger acceptance
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  debugger:
    name: "Debugger runtime | ${{ matrix.os }} | CPython ${{ matrix.python }} | DAP + shutdown"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        include:
          - os: macos-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    env:
      APK_BACKEND: runtime
      RUST_BACKTRACE: '1'
    steps:
      - name: Enable Git long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          repository: Mengzhiyaa/apk
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.APK_SOURCE_PAT }}
      - uses: ./.github/actions/setup-test
        with:
          python-version: ${{ matrix.python }}
          python-dependencies: 'false'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: kernel-${{ runner.os }}-${{ runner.arch }}-runtime
          save-if: false
      - name: Run debugger unit, protocol, callback and native shutdown checks
        run: just ci-debug
