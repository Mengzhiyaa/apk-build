name: "Test APK - Windows"

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        description: "The commit SHA from the apks repository"
        type: string

jobs:
  windows:
    name: "Rust: stable, OS: windows-latest"
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout apks source
        uses: actions/checkout@v4
        with:
          repository: Mengzhiyaa/apk
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.APK_SOURCE_PAT }}

      - name: Install system dependencies
        shell: pwsh
        run: |
          vcpkg install zeromq:x64-windows
          echo "CMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" >> $env:GITHUB_ENV

      - name: Set up uv Python environment
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.13"
          activate-environment: true
          enable-cache: true
          cache-suffix: apk-tests-py313
          ignore-nothing-to-cache: true

      - name: Install Python test dependencies
        shell: pwsh
        run: |
          uv pip install "numpy>=1.26" "pandas>=2.1" "matplotlib>=3.8" "ipywidgets>=8.1" "debugpy>=1.8"
          $python = python -c "import sys; print(sys.executable)"
          "APK_PYTHON_PATH=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          python -c "import debugpy, ipywidgets, matplotlib, numpy, pandas; print('Python test dependencies ready')"

      - name: Report Rust Toolchain
        run: rustup show

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # ----------------------------------------------------------------
      # Windows-specific libpython diagnostic step.
      # Always runs (does not gate the build). It snapshots:
      #   1. The python interpreter used by `uv` (prefix, SOABI, version).
      #   2. The pythonXY.dll that the project's find_libpython.py would
      #      actually load (prefix\browser\pythonXY.dll, via py launcher).
      #   3. A heuristic export-table probe for the symbols libpy cares
      #      about, so a single CI failure can be traced to "DLL X
      #      doesn't export PyRun_SimpleStringFlags" without rerunning.
      # ----------------------------------------------------------------
      - name: Diagnose Windows libpython DLL exports
        if: always()
        shell: pwsh
        run: |
          $py = (Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if (-not $py) {
            Write-Host "python.exe not on PATH; skipping DLL diagnostics"
            exit 0
          }
          $pyRoot = Split-Path -Parent $py
          $ver = & python -c "import sys; print(f'{sys.version_info.major}{sys.version_info.minor}')"
          Write-Host "===== Python interpreter ====="
          Write-Host "Executable: $py"
          Write-Host "Version:    $(python --version)"
          & python -c "import sys, sysconfig; print('Prefix:', sys.prefix); print('SOABI:', sysconfig.get_config_var('SOABI')); print('LDLIBRARY:', sysconfig.get_config_var('LDLIBRARY'))"
          # Free-threaded builds report a `t` suffix in the SOABI.
          $soabi = & python -c "import sysconfig; print(sysconfig.get_config_var('SOABI') or '')"
          $isFreeThreaded = $soabi -like '*t-cpython*'
          Write-Host "Free-threaded build: $isFreeThreaded"

          # The python.org launcher installs both pythonXY.dll and
          # pythonXYt.dll side-by-side. uv's installed interpreter is
          # the `t` variant when free-threaded is selected.
          $candidates = @(
            (Join-Path $pyRoot "python$ver.dll"),
            (Join-Path $pyRoot "python${ver}t.dll")
          )
          Write-Host "===== Candidate DLLs ====="
          foreach ($c in $candidates) {
            if (Test-Path $c) {
              $v = (Get-Item $c).VersionInfo
              Write-Host ("  [+] {0}  size={1}  fileVersion={2}" -f $c, (Get-Item $c).Length, $v.FileVersion)
            } else {
              Write-Host "  [-] $c (not found)"
            }
          }

          # Pick the DLL that find_libpython.py would pick (pythonXY.dll
          # in the interpreter directory).
          $dll = Join-Path $pyRoot "python$ver.dll"
          if (-not (Test-Path $dll)) {
            Write-Host "No pythonXY.dll found next to python.exe; skipping export probe"
            exit 0
          }
          Write-Host "===== DLL under test ====="
          Write-Host "Path: $dll"
          Write-Host "Ver:  $((Get-Item $dll).VersionInfo.FileVersion)"

          # Heuristic export-name probe. A DLL's export directory is
          # parsed properly by dumpbin (MSVC) or llvm-readobj (LLVM).
          # On stock windows-latest runner we don't have either, so we
          # fall back to last-resort string matching against the file
          # bytes. This is sufficient for distinguishing "the symbol
          # string is not in the DLL's export table" from "the symbol
          # exists but is not resolvable by libloading".
          $symbols = @(
            'Py_Initialize',
            'Py_InitializeEx',
            'Py_FinalizeEx',
            'Py_IsInitialized',
            'PyRun_SimpleString',
            'PyRun_SimpleStringFlags',
            'PyRun_String',
            'PyRun_StringFlags',
            'Py_CompileString',
            'Py_CompileStringExFlags',
            'PyLong_FromLong',
            'PyLong_AsLong',
            'PyGILState_Ensure',
            'PyGILState_Release',
            '_Py_NoneStruct'
          )
          $raw = [System.IO.File]::ReadAllBytes($dll)
          Write-Host "===== Export-name presence (heuristic) ====="
          foreach ($s in $symbols) {
            $needle = [System.Text.Encoding]::ASCII.GetBytes($s)
            $b64 = [System.Convert]::ToBase64String($raw)
            $found = $b64.IndexOf([System.Convert]::ToBase64String($needle)) -ge 0
            $mark = if ($found) { '[+] ' } else { '[-] ' }
            Write-Host ("  {0}{1}" -f $mark, $s)
          }
          # Per the original failure signature:
          #   - Py_Initialize / Py_FinalizeEx / PyLong_FromLong / PyGILState_*
          #     were present (test_load_library & functional tests passed).
          #   - PyRun_SimpleStringFlags was the missing piece.
          # Once we see [-] PyRun_SimpleStringFlags in this log, we have
          # local confirmation that the Windows DLL simply doesn't export
          # the underlying symbol that PyRun_SimpleString's macro expands to.

      - name: Build
        run: cargo build --workspace --features lsp

      - name: Run Tests
        run: cargo test --workspace --features lsp

      - name: Run Notebook Completion Test (LSP)
        shell: pwsh
        run: |
          $env:APK_TEST_SESSION_MODE = "notebook"
          cargo test -p apk --features lsp --test kernel_notebook_suite test_notebook_completion_os_path

      - name: Run APK Optional-Dependency Coverage
        shell: pwsh
        run: |
          cargo test -p apk --test kernel_suite 'kernel_widget::'
          cargo test -p apk --test kernel_suite 'kernel_plots::'
          cargo test -p apk --test kernel_background_suite 'kernel_plots_background::'
          cargo test -p apk --test kernel_notebook_suite 'kernel_plots_notebook::'
          cargo test -p apk --test kernel_notebook_suite 'kernel_mpl_split_cells::'
          cargo test -p apk --test integration test_dataframe_resolve
          cargo test -p apk --test integration test_matplotlib_backend_load
          cargo test -p apk --test integration test_matplotlib_after_display_override

      # ----------------------------------------------------------------
      # Targeted libpy Windows regression capture.
      # Mirrors the matrix in test-libpy-windows.yml but runs only the
      # default interpreter that's already installed for the apk suite.
      # Output is captured to a log artifact for offline diagnosis.
      # ----------------------------------------------------------------
      - name: Run libpy integration tests on Windows (allow-failure)
        if: always()
        shell: pwsh
        run: |
          $env:RUST_BACKTRACE = "1"
          cargo test -p libpy --test integration -- --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath libpy-windows-integration.log

      - name: Upload libpy Windows log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libpy-windows-default-integration
          path: libpy-windows-integration.log
          if-no-files-found: ignore
          retention-days: 14
