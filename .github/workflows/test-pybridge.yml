name: "Test pybridge - CPython ABI Matrix"

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        description: "The commit SHA from the apk repository"
        type: string

permissions:
  contents: read

jobs:
  pybridge_matrix:
    name: "pybridge: Python ${{ matrix.python }} (${{ matrix.os }}, ${{ matrix.arch }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # x64 Linux/Windows and matching macOS ARM64/Intel rows now run in
        # test-libpy.yml on the runner that already provisioned that Python.
        # Keep only architecture/host combinations without a matching libpy
        # runner here.
        include:
          # Retain Intel coverage for the largest versioned PyConfig entry and
          # the opaque PyInitConfig backend. Python 3.8 Intel is covered by its
          # existing libpy compatibility runner.
          - os: macos-15-intel
            arch: x64
            python: "3.13"
          - os: macos-15-intel
            arch: x64
            python: "3.14"

          # Representative native ARM64 coverage not already supplied by the
          # macos-latest libpy rows.
          - os: ubuntu-24.04-arm
            arch: arm64
            python: "3.13"
          - os: ubuntu-24.04-arm
            arch: arm64
            python: "3.14"
          - os: windows-11-arm
            arch: arm64
            python: "3.13"
          - os: windows-11-arm
            arch: arm64
            python: "3.14"

    steps:
      - name: Checkout apk source
        uses: actions/checkout@v7
        with:
          repository: Mengzhiyaa/apk
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.APK_SOURCE_PAT }}

      - name: Set up MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'x64' }}

      - name: Set up Python ${{ matrix.python }} (${{ matrix.arch }})
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}

      - name: Select Python for pybridge tests
        run: >-
          python -c "import os, sys;
          print(sys.version);
          print(sys.executable);
          open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write('APK_PYTHON_PATH=' + sys.executable + '\n')"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: pybridge-abi-${{ matrix.os }}-${{ matrix.arch }}-py${{ matrix.python }}

      - name: Verify PyConfig ABI and initialize selected Python
        env:
          # Makes the unit test compile a temporary C probe against the selected
          # Python.h. This is CI-only and is not part of APK's normal build.
          APK_VERIFY_PYCONFIG_ABI: "1"
        run: cargo test -p pybridge -- --nocapture --test-threads=1
